name: Update profile cards

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-cards.yml'

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=xi029&theme=aura&show_icons=true&hide=stars
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      - name: Generate languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=xi029&layout=compact
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: 'true'

      # Mirror listed by ryo-ma/github-profile-trophy. Keep the last good image
      # if the upstream service is unavailable; README never hotlinks to it.
      - name: Refresh cached trophies
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import Request, urlopen
          import xml.etree.ElementTree as ET

          path = Path('assets/trophies.svg')
          url = 'https://trophy.ryglcloud.net/?username=xi029&theme=gruvbox&row=1&column=7&no-frame=true&no-bg=true'
          try:
              request = Request(url, headers={'User-Agent': 'xi029-profile-cards'})
              with urlopen(request, timeout=45) as response:
                  data = response.read()
              root = ET.fromstring(data)
              if root.tag != '{http://www.w3.org/2000/svg}svg':
                  raise ValueError('Expected an SVG trophy card')
              labels = ' '.join(root.itertext())
              if not all(label in labels for label in ('Stars', 'Followers', 'Repositories')):
                  raise ValueError('Trophy response is missing expected statistics')
              path.write_bytes(data)
          except Exception as error:
              if not path.exists():
                  raise
              print(f'::warning::Keeping the previous trophy card: {error}')

      - name: Validate SVGs
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in ('stats', 'top-langs', 'trophies'):
              root = ET.parse(Path('assets') / f'{name}.svg').getroot()
              assert root.tag == '{http://www.w3.org/2000/svg}svg', name
              assert 'Something went wrong' not in ''.join(root.itertext()), name

      - name: Commit updated cards
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/stats.svg assets/top-langs.svg assets/trophies.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh profile cards'
          git push
